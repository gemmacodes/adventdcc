<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#04070f" />
<title data-text="common.pageTitle"></title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="phone">
  <div class="scanline"></div>
  <div class="boot" id="boot"><div class="bootlines" id="bootlines"></div></div>

  <div class="topbar">
    <div class="sysbar">
      <span class="dot"></span> <span data-text="common.online"></span>
      <span class="right" id="crawlerId"></span>
    </div>
    <div class="calhead">
      <div class="brand-row">
        <div class="brand"><span data-text="common.crawler"></span> <span class="accent" id="crawlerName"></span></div>
        <button type="button" class="profile-button" id="profileNav" data-label="profile.heading" data-title="profile.heading" onclick="App.openProfile()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5" />
            <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
          </svg>
        </button>
      </div>
      <div class="sub" data-text="calendar.subtitle"></div>
      <div class="meter"><i id="meterFill"></i></div>
      <div class="meterlabel">
        <span id="floorsLabel"></span>
        <span id="goldLabel"></span>
      </div>
    </div>
  </div>

  <div class="screen">

    <!-- CALENDAR -->
    <section id="calendar" class="view active">
      <div class="grid" id="grid"></div>
      <div class="hint" id="hint" data-text="calendar.hint"></div>
    </section>

    <section id="profile" class="view" aria-labelledby="profileHeading">
      <button type="button" class="back profile-back" data-text="common.back" onclick="App.goHome()"></button>
      <div class="profile-card identity">
        <div class="identity-top">
          <div class="profile-avatar">
            <img id="profilePortrait" src="samu-portrait.jpg" width="64" height="80" alt="" decoding="async" />
          </div>
          <div class="identity-copy">
            <div class="profile-kicker" data-text="profile.kicker"></div>
            <h1 id="profileHeading" tabindex="-1"><span id="profileName"></span></h1>
            <p id="profileId"></p>
            <span class="profile-badge" id="profileBadge"></span>
          </div>
        </div>
        <p id="profileWarName" class="profile-alias" hidden></p>
        <p id="profileMotto" class="profile-motto" hidden></p>
        <details id="identityDetails" class="profile-details" hidden>
          <summary data-text="profile.identityDetails"></summary>
          <div id="campaignIdentity" class="campaign-list"></div>
        </details>
        <div class="profile-progress" data-label="profile.progress">
          <div><strong id="profileFloors"></strong><span data-text="profile.floors"></span></div>
          <div><strong id="profileGold"></strong><span data-text="profile.credits"></span></div>
        </div>
      </div>
      <div class="profile-card" id="attributesCard" hidden>
        <h2 data-text="profile.attributes"></h2>
        <div id="profileStats" hidden>
          <dl class="attribute-grid">
            <div><dt data-text="profile.strength"></dt><dd><span id="statStrengthValue"></span><meter id="statStrength" min="0" max="20" value="0" data-label="profile.strength"></meter><small id="statStrengthBreakdown"></small></dd></div>
            <div><dt data-text="profile.wit"></dt><dd><span id="statWitValue"></span><meter id="statWit" min="0" max="20" value="0" data-label="profile.wit"></meter><small id="statWitBreakdown"></small></dd></div>
            <div><dt data-text="profile.charm"></dt><dd><span id="statCharmValue"></span><meter id="statCharm" min="0" max="20" value="0" data-label="profile.charm"></meter><small id="statCharmBreakdown"></small></dd></div>
          </dl>
          <p class="profile-note" data-text="profile.attributesNote"></p>
        </div>
        <p id="profileEarnedAttributes" class="profile-note" hidden></p>
        <div id="profileStatSetup" hidden>
          <p class="profile-note" data-text="profile.attributesPending"></p>
          <button type="button" class="ghost" id="setAttributes" data-text="profile.setAttributes"></button>
        </div>
        <details id="profileAbilities" class="profile-details" hidden>
          <summary data-text="profile.abilities"></summary>
          <div id="campaignAbilities" class="campaign-list"></div>
        </details>
      </div>
      <div class="profile-card" id="companionCard" hidden>
        <h2 data-text="profile.companion"></h2>
        <div id="campaignCompanion" class="campaign-list"></div>
      </div>
      <div class="profile-card" id="plansCard" hidden>
        <h2 data-text="profile.plans"></h2>
        <div id="campaignPlans" class="campaign-list"></div>
        <details id="completedPlans" class="profile-details" hidden>
          <summary id="completedPlansSummary"></summary>
          <div id="campaignCompletedPlans" class="campaign-list"></div>
        </details>
      </div>
      <div class="profile-card" id="lootCard" hidden>
        <h2 data-text="profile.loot"></h2>
        <div class="loot-tabs" role="tablist" data-label="profile.loot">
          <button type="button" id="lootTitlesTab" role="tab" data-loot-tab="titles" aria-controls="titlesSection" aria-selected="true"></button>
          <button type="button" id="lootInventoryTab" role="tab" data-loot-tab="inventory" aria-controls="inventorySection" aria-selected="false" tabindex="-1"></button>
        </div>
        <div id="titlesSection" role="tabpanel" aria-labelledby="lootTitlesTab" tabindex="0">
          <div id="campaignTitles"></div>
        </div>
        <div id="inventorySection" role="tabpanel" aria-labelledby="lootInventoryTab" tabindex="0" hidden>
          <div id="campaignInventory" class="campaign-list"></div>
        </div>
      </div>
      <details class="profile-card profile-settings" id="interfaceSettings">
        <summary data-text="profile.settings"></summary>
        <label class="setting" for="settingSound">
          <span><strong data-text="profile.sound"></strong><small data-text="profile.soundNote"></small></span>
          <input class="toggle" type="checkbox" role="switch" id="settingSound" data-profile="sound" />
        </label>
        <label class="setting" for="settingHaptics">
          <span><strong data-text="profile.haptics"></strong><small data-text="profile.hapticsNote"></small></span>
          <input class="toggle" type="checkbox" role="switch" id="settingHaptics" data-profile="haptics" />
        </label>
        <label class="setting" for="settingTypewriter">
          <span><strong data-text="profile.typewriter"></strong><small data-text="profile.typewriterNote"></small></span>
          <input class="toggle" type="checkbox" role="switch" id="settingTypewriter" data-profile="typewriter" />
        </label>
        <label class="setting" for="settingMotion">
          <span><strong data-text="profile.reducedMotion"></strong><small data-text="profile.reducedMotionNote"></small></span>
          <input class="toggle" type="checkbox" role="switch" id="settingMotion" data-profile="reducedMotion" />
        </label>
        <p class="profile-note" data-text="profile.savedNote"></p>
      </details>
    </section>

    <!-- MESSAGE -->
    <section id="message" class="view">
      <button type="button" class="back profile-back" data-text="common.back" onclick="App.goHome()"></button>
      <div class="alert">
        <div class="hd"><span class="warn" id="msgHd">⚠</span> <span id="msgHdText" data-text="message.notification"></span></div>
        <div class="floor" id="msgFloor"></div>
        <div class="title" id="msgTitle"></div>
        <div class="body" id="msgBody"></div>

        <form class="mission" id="missionForm">
          <h2 data-text="mission.heading"></h2>
          <div id="missionRecap"></div>
          <div id="missionFields"></div>
          <div id="missionHints" class="mission-hints"></div>
          <button type="button" class="ghost" id="hintBtn" data-text="mission.hint" hidden></button>
          <p class="mission-feedback" id="missionError" role="alert" hidden></p>
          <button type="submit" class="mission-submit" id="missionSubmit" data-text="mission.submit"></button>
          <p class="profile-note" id="draftStatus"></p>
          <p class="profile-note" data-text="mission.privacy"></p>
        </form>
        <div class="mission-result" id="missionResult" role="status" hidden></div>
      </div>

      <div class="ach" id="rewardBox" hidden>
        <div class="ic" id="rewardIcon" data-text="message.achievementIcon"></div>
        <div>
          <div class="t1" id="rewardKicker" data-text="message.achievement"></div>
          <div class="t2" id="rewardName"></div>
          <div class="t3" id="rewardDetail"></div>
        </div>
      </div>

      <div class="footerbtns">
        <button type="button" class="ghost" data-text="common.done" onclick="App.goHome()"></button>
      </div>
    </section>

  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="strings.js"></script>
<script src="app.js"></script>
</body>
</html>
